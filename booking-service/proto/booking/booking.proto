syntax = "proto3";

package booking;

option go_package = "./proto/booking";

message Booking {
  string id               = 1;
  string user_id          = 2;
  string session_id       = 3;
  string seat_id          = 4;
  string status           = 5;
  int64  created_at       = 6;
  string ticket_category  = 7;
  double amount_paid      = 8;
}

message Payment {
  string id          = 1;
  string booking_id  = 2;
  double amount      = 3;
  string status      = 4;
  int64  paid_at     = 5;
}

message CreateBookingRequest {
  string user_id          = 1;
  string session_id       = 2;
  string seat_id          = 3;
  string user_email       = 4;
  string ticket_category  = 5;
  double amount           = 6;
}

message CreateBookingResponse {
  Booking booking = 1;
}

message GetBookingRequest {
  string booking_id = 1;
}

message GetBookingResponse {
  Booking booking = 1;
}

message ListUserBookingsRequest {
  string user_id = 1;
}

message ListUserBookingsResponse {
  repeated Booking bookings = 1;
}

message CancelBookingRequest {
  string booking_id = 1;
  string user_email = 2;
}

message CancelBookingResponse {
  bool success = 1;
}

message ConfirmPaymentRequest {
  string booking_id = 1;
  double amount     = 2;
  string user_email = 3;
  bool   deduct_balance = 4;
}

message ConfirmPaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id  = 1;
  string booking_id  = 2;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ListPaymentsRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32            total    = 2;
}

message RefundPaymentRequest {
  string payment_id = 1;
}

message RefundPaymentResponse {
  bool success = 1;
}

message CheckSeatRequest {
  string seat_id = 1;
}

message CheckSeatResponse {
  bool is_available = 1;
}

message GetSessionTakenSeatsRequest {
  string session_id = 1;
}

message GetSessionTakenSeatsResponse {
  repeated string seat_ids = 1;
}

message GetHistoryRequest {
  string user_id = 1;
}

message GetHistoryResponse {
  repeated Booking bookings = 1;
}

message AdminListRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message AdminListResponse {
  repeated Booking bookings = 1;
  int32            total    = 2;
}

message GetStatsRequest {}

message GetStatsResponse {
  int64 total     = 1;
  int64 confirmed = 2;
  int64 cancelled = 3;
}

service BookingService {
  rpc CreateBooking        (CreateBookingRequest)  returns (CreateBookingResponse);
  rpc GetBooking           (GetBookingRequest)     returns (GetBookingResponse);
  rpc ListUserBookings     (ListUserBookingsRequest) returns (ListUserBookingsResponse);
  rpc CancelBooking        (CancelBookingRequest)  returns (CancelBookingResponse);

  rpc ConfirmPayment       (ConfirmPaymentRequest) returns (ConfirmPaymentResponse);
  rpc GetPayment           (GetPaymentRequest)     returns (GetPaymentResponse);
  rpc ListPayments         (ListPaymentsRequest)   returns (ListPaymentsResponse);
  rpc RefundPayment        (RefundPaymentRequest)  returns (RefundPaymentResponse);

  rpc CheckSeatAvailability (CheckSeatRequest)     returns (CheckSeatResponse);
  rpc GetSessionTakenSeats  (GetSessionTakenSeatsRequest) returns (GetSessionTakenSeatsResponse);
  rpc GetBookingHistory     (GetHistoryRequest)    returns (GetHistoryResponse);
  rpc AdminListBookings     (AdminListRequest)     returns (AdminListResponse);
  rpc GetBookingStats       (GetStatsRequest)      returns (GetStatsResponse);
}
