syntax = "proto3";

package user;

option go_package = "github.com/cinema-booking-system/user-service/proto/user;userpb";

import "google/protobuf/timestamp.proto";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_GUEST       = 1;
  ROLE_USER        = 2;
  ROLE_MODERATOR   = 3;
  ROLE_ADMIN       = 4;
}

message User {
  string                    user_id    = 1;
  string                    email      = 2;
  string                    full_name  = 3;
  string                    phone      = 4;
  Role                      role       = 5;
  bool                      is_banned  = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  double                    balance    = 9;
}

message PaginationRequest {
  int32 page      = 1;
  int32 page_size = 2;
}

message PaginationResponse {
  int32 page        = 1;
  int32 page_size   = 2;
  int32 total_pages = 3;
  int64 total_items = 4;
}

message RegisterRequest {
  string full_name        = 1;
  string email            = 2;
  string phone            = 3;
  string password         = 4;
  string confirm_password = 5;
}

message RegisterResponse {
  User   user         = 1;
  string access_token  = 2;
  string refresh_token = 3;
  string message       = 4;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  User   user          = 1;
  string access_token  = 2;
  string refresh_token = 3;
  string message       = 4;
}

message LogoutRequest {
  string access_token  = 1;
  string refresh_token = 2;
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id   = 1;
  string full_name = 2;
  string phone     = 3;
}

message UpdateProfileResponse {
  User   user    = 1;
  string message = 2;
}

message DeleteAccountRequest {
  string user_id  = 1;
  string password = 2;
}

message DeleteAccountResponse {
  bool   success = 1;
  string message = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool   valid   = 1;
  string user_id = 2;
  string email   = 3;
  Role   role    = 4;
  string message = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
  string message       = 3;
}

message ChangePasswordRequest {
  string user_id          = 1;
  string old_password     = 2;
  string new_password     = 3;
  string confirm_password = 4;
}

message ChangePasswordResponse {
  bool   success = 1;
  string message = 2;
}

message GetAllUsersRequest {
  PaginationRequest pagination = 1;
  string            role_filter = 2;
  bool              banned_only = 3;
  string            admin_id    = 4;
}

message GetAllUsersResponse {
  repeated User      users      = 1;
  PaginationResponse pagination = 2;
}

message BanUserRequest {
  string admin_id = 1;
  string user_id  = 2;
  bool   ban      = 3;
  string reason   = 4;
}

message BanUserResponse {
  User   user    = 1;
  string message = 2;
}

message GetUserByEmailRequest {
  string email    = 1;
  string admin_id = 2;
}

message GetUserByEmailResponse {
  User user = 1;
}

message TopUpBalanceRequest {
  string user_id = 1;
  double amount  = 2;
}

message TopUpBalanceResponse {
  User   user    = 1;
  string message = 2;
}

message DeductBalanceRequest {
  string user_id = 1;
  double amount  = 2;
}

message DeductBalanceResponse {
  User   user    = 1;
  string message = 2;
}

message UpdateUserRoleRequest {
  string admin_id = 1;
  string user_id  = 2;
  Role   role     = 3;
}

message UpdateUserRoleResponse {
  User   user    = 1;
  string message = 2;
}

service UserService {
  rpc Register       (RegisterRequest)       returns (RegisterResponse);
  rpc Login          (LoginRequest)          returns (LoginResponse);
  rpc Logout         (LogoutRequest)         returns (LogoutResponse);
  rpc GetProfile     (GetProfileRequest)     returns (GetProfileResponse);
  rpc UpdateProfile  (UpdateProfileRequest)  returns (UpdateProfileResponse);
  rpc DeleteAccount  (DeleteAccountRequest)  returns (DeleteAccountResponse);
  rpc ValidateToken  (ValidateTokenRequest)  returns (ValidateTokenResponse);
  rpc RefreshToken   (RefreshTokenRequest)   returns (RefreshTokenResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc GetAllUsers    (GetAllUsersRequest)    returns (GetAllUsersResponse);
  rpc BanUser        (BanUserRequest)        returns (BanUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc TopUpBalance   (TopUpBalanceRequest)   returns (TopUpBalanceResponse);
  rpc DeductBalance  (DeductBalanceRequest)  returns (DeductBalanceResponse);
  rpc UpdateUserRole (UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
}
